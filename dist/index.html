    <div id="app"></div>
    <!-- Performance: Defer non-critical script execution to reduce render delay (invisible) -->
    <script>
      (function() {
        'use strict';
        // Defer non-critical operations to reduce main-thread blocking
        // This helps reduce element render delay (currently 1,200ms)
        function deferNonCritical() {
          // Defer analytics, tracking, and other non-critical scripts
          if ('requestIdleCallback' in window) {
            requestIdleCallback(function() {
              // Non-critical operations can run here
            }, { timeout: 2000 });
          } else {
            // Fallback for browsers without requestIdleCallback
            setTimeout(function() {}, 100);
          }
        }
        // Run after initial render
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', deferNonCritical);
        } else {
          deferNonCritical();
        }
      })();
    </script>
  </body>
