<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8be0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0bb2d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1579d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="#f0f9ff" />

  <!-- Water Droplet -->
  <path
    d="M 50 12 Q 70 38 50 62 Q 30 38 50 12 Z"
    fill="url(#waterGradient)"
    filter="url(#shadow)"
  />

  <!-- Highlight on Droplet -->
  <ellipse
    cx="42"
    cy="28"
    rx="8"
    ry="12"
    fill="white"
    opacity="0.5"
  />

  <!-- Left Leaf -->
  <path
    d="M 35 55 Q 28 60 30 68 Q 32 65 35 62 Q 33 58 35 55 Z"
    fill="url(#leafGradient)"
    opacity="0.9"
  />

  <!-- Right Leaf -->
  <path
    d="M 65 55 Q 72 60 70 68 Q 68 65 65 62 Q 67 58 65 55 Z"
    fill="url(#leafGradient)"
    opacity="0.9"
  />

  <!-- Small Droplet at Bottom -->
  <ellipse
    cx="50"
    cy="72"
    rx="6"
    ry="8"
    fill="#0bb2d4"
    opacity="0.8"
  />
</svg>
