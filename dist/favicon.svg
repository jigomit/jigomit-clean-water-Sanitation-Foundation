<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="waterGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8be0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0bb2d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1579d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Water Droplet -->
  <path
    d="M 50 10 Q 70 40 50 65 Q 30 40 50 10 Z"
    fill="url(#waterGradient)"
    filter="url(#shadow)"
  />

  <!-- Highlight -->
  <ellipse
    cx="42"
    cy="30"
    rx="8"
    ry="12"
    fill="white"
    opacity="0.4"
  />

  <!-- Ripple Base -->
  <ellipse
    cx="50"
    cy="75"
    rx="30"
    ry="8"
    fill="#0bb2d4"
    opacity="0.3"
  />

  <!-- Ripple Wave -->
  <ellipse
    cx="50"
    cy="75"
    rx="40"
    ry="10"
    fill="none"
    stroke="#0bb2d4"
    stroke-width="1.5"
    opacity="0.2"
  />
</svg>
