<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bio-digester system">
  <defs>
    <linearGradient id="g12-ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8a882"/>
      <stop offset="100%" stop-color="#8b7355"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#e8f4f8"/>
  <!-- Cross-section view -->
  <!-- Underground digester tank -->
  <ellipse cx="300" cy="280" rx="120" ry="60" fill="#5d4e37" opacity="0.9"/>
  <ellipse cx="300" cy="270" rx="110" ry="55" fill="#49d391" opacity="0.4"/>
  <!-- Ground level -->
  <rect y="230" width="600" height="170" fill="url(#g12-ground)"/>
  <!-- Cut-away showing tank -->
  <rect x="180" y="230" width="240" height="100" fill="#8b7355" opacity="0.3"/>
  <ellipse cx="300" cy="280" rx="100" ry="45" fill="#3a6e3f" opacity="0.6"/>
  <!-- Inlet pipe -->
  <rect x="140" y="210" width="15" height="50" fill="#1b4e80" rx="3"/>
  <rect x="120" y="180" width="55" height="35" fill="#a04000"/>
  <text x="130" y="202" fill="#fff" font-size="11">WC</text>
  <!-- Gas pipe -->
  <rect x="295" y="180" width="10" height="60" fill="#0fa3b1" rx="2"/>
  <path d="M300 180 L300 160 L400 160 L400 200" stroke="#0fa3b1" stroke-width="10" fill="none"/>
  <!-- Kitchen/stove -->
  <rect x="380" y="200" width="60" height="40" fill="#1b4e80" rx="4"/>
  <circle cx="395" cy="215" r="8" fill="#ff6b35"/>
  <circle cx="425" cy="215" r="8" fill="#ff6b35"/>
  <text x="395" y="235" fill="#fff" font-size="10">STOVE</text>
  <!-- Outlet pipe -->
  <rect x="445" y="240" width="15" height="40" fill="#0fa3b1" rx="3"/>
  <rect x="455" y="275" width="80" height="5" fill="#0fa3b1" rx="2"/>
  <!-- Garden -->
  <circle cx="550" cy="290" r="15" fill="#49d391"/>
  <rect x="547" y="305" width="6" height="25" fill="#5d4e37"/>
  <text x="460" y="330" fill="#1b4e80" font-size="12">Fertilizer</text>
</svg>
