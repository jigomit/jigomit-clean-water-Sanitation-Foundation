<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hygiene education classroom">
  <defs>
    <linearGradient id="g10-wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff9e6"/>
      <stop offset="100%" stop-color="#f0e8d0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#g10-wall)"/>
  <!-- Floor -->
  <rect y="320" width="600" height="80" fill="#d4c4a8"/>
  <!-- Blackboard -->
  <rect x="50" y="60" width="240" height="160" fill="#2d4a3e" rx="6"/>
  <!-- Drawings on board (handwashing steps) -->
  <circle cx="100" cy="110" r="18" fill="#f39c6b"/>
  <rect x="95" y="128" width="10" height="25" fill="#fff" opacity="0.8"/>
  <circle cx="105" cy="160" r="12" fill="#3fc1ff" opacity="0.7"/>
  <text x="140" y="95" fill="#fff" font-size="16" font-weight="bold">WASH</text>
  <text x="140" y="115" fill="#fff" font-size="12">HANDS</text>
  <circle cx="200" cy="135" r="20" fill="#0bb2d4" opacity="0.6"/>
  <rect x="215" y="125" width="50" height="3" fill="#fff"/>
  <rect x="230" y="135" width="3" height="20" fill="#fff"/>
  <!-- Students (simplified) -->
  <circle cx="340" cy="240" r="22" fill="#f39c6b"/>
  <rect x="323" y="262" width="34" height="50" fill="#0bb2d4" rx="4"/>
  <circle cx="420" cy="235" r="20" fill="#f39c6b"/>
  <rect x="405" y="255" width="30" height="45" fill="#49d391" rx="4"/>
  <circle cx="500" cy="242" r="21" fill="#f39c6b"/>
  <rect x="485" y="263" width="30" height="48" fill="#f39c6b" opacity="0.7" rx="4"/>
  <!-- Teacher -->
  <circle cx="150" cy="260" r="24" fill="#f39c6b"/>
  <rect x="133" y="284" width="34" height="55" fill="#1b4e80" rx="4"/>
  <line x1="165" y1="295" x2="200" y2="270" stroke="#1b4e80" stroke-width="5" stroke-linecap="round"/>
</svg>
