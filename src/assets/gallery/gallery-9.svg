<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Water quality testing">
  <defs>
    <linearGradient id="g9-table" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#a08968"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#f4f9ff"/>
  <!-- Table -->
  <rect x="100" y="220" width="400" height="20" fill="url(#g9-table)" rx="4"/>
  <rect x="120" y="240" width="10" height="80" fill="#8a7a60"/>
  <rect x="470" y="240" width="10" height="80" fill="#8a7a60"/>
  <!-- Test tubes -->
  <rect x="180" y="150" width="30" height="80" fill="#e8f4f8" stroke="#0bb2d4" stroke-width="3" rx="2"/>
  <rect x="180" y="190" width="30" height="40" fill="#3fc1ff" opacity="0.7"/>
  <rect x="250" y="160" width="30" height="70" fill="#e8f4f8" stroke="#49d391" stroke-width="3" rx="2"/>
  <rect x="250" y="195" width="30" height="35" fill="#49d391" opacity="0.6"/>
  <rect x="320" y="155" width="30" height="75" fill="#e8f4f8" stroke="#f39c6b" stroke-width="3" rx="2"/>
  <rect x="320" y="195" width="30" height="35" fill="#f39c6b" opacity="0.5"/>
  <!-- Microscope -->
  <circle cx="420" cy="170" r="25" fill="#1b4e80"/>
  <rect x="410" y="195" width="20" height="35" fill="#0fa3b1"/>
  <rect x="395" y="225" width="50" height="8" fill="#1b4e80" rx="2"/>
  <!-- Results paper -->
  <rect x="130" y="140" width="35" height="50" fill="#fff" stroke="#ccc" stroke-width="2"/>
  <line x1="135" y1="150" x2="160" y2="150" stroke="#0bb2d4" stroke-width="2"/>
  <line x1="135" y1="160" x2="158" y2="160" stroke="#999" stroke-width="1"/>
  <line x1="135" y1="168" x2="158" y2="168" stroke="#999" stroke-width="1"/>
  <line x1="135" y1="176" x2="155" y2="176" stroke="#999" stroke-width="1"/>
</svg>
