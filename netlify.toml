# Netlify Configuration - Performance Optimization
# Invisible changes only: cache headers and compression

[build]
  command = "npm run build"
  publish = "dist"

# SPA Routing: Redirect all routes to index.html for Vue Router (fixes 404 errors)
# This allows client-side routing to work properly on all pages
# Note: public/_redirects file is also used as a backup (more reliable)
# Netlify automatically excludes existing files, so static assets are served directly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # Exclude static assets - they will be served directly
  # Netlify checks file existence before applying redirects

# Cache headers for static assets (1 year)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML should be revalidated
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Performance: Security headers (also help with performance)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Performance: Optimize font loading (if fonts are used)
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cross-Origin-Resource-Policy = "cross-origin"

