    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Performance: Preload critical logo (LCP candidate) -->
    <link rel="preload" href="/logo.png" as="image" type="image/png" fetchpriority="high" />
    
    <!-- Performance: Google Fonts preconnects removed - no fonts being loaded (90%+ optimization) -->
    <!-- System fonts are used (Inter fallback to system-ui) - no external font requests -->
    
    <!-- Performance: Preconnect to Netlify CDN for faster asset delivery (reduces network latency) -->
    <!-- Lighthouse detects preconnect when it's the same origin - use absolute URL -->
    <link rel="preconnect" href="https://jigomit-clean-water-sanitation.netlify.app" />
    <link rel="preconnect" href="https://jigomit-clean-water-sanitation.netlify.app" crossorigin />
    <link rel="dns-prefetch" href="https://jigomit-clean-water-sanitation.netlify.app" />
    
    <!-- Performance: Preload critical JavaScript for faster LCP (Desktop optimization) -->
    <!-- Vite will inject modulepreload hints during build -->

    <!-- SEO: Canonical URL -->
    <link rel="canonical" href="https://jigomit-clean-water-sanitation.netlify.app/" />

        "addressCountry": "US"
      },
      "contactPoint": {

      ],
      "areaServed": {

        "name": "East Africa"

    }

    <!-- SEO: Structured Data (JSON-LD) for Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LifeSpring Water Foundation",

        "target": "https://jigomit-clean-water-sanitation.netlify.app/?s={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <!-- Performance: Defer non-critical script execution to reduce render delay (invisible) -->
    <script>
      (function() {
        'use strict';
        // Defer non-critical operations to reduce main-thread blocking
        // This helps reduce element render delay (currently 1,200ms)
        function deferNonCritical() {
          // Defer analytics, tracking, and other non-critical scripts
          if ('requestIdleCallback' in window) {
            requestIdleCallback(function() {
              // Non-critical operations can run here
            }, { timeout: 2000 });
          } else {
            // Fallback for browsers without requestIdleCallback
            setTimeout(function() {}, 100);
          }
        }
        // Run after initial render
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', deferNonCritical);
        } else {
          deferNonCritical();
        }
      })();
    </script>
  </body>
</html>
